<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>%VITE_APP_TITLE%</title>
</head>
<body>
<div id="app"></div>
<script type="module">
  const hash = window.location.hash || ''
  const path = window.location.pathname || ''
  const isDisplay = hash.startsWith('#/display') || path.endsWith('/display')

  if (isDisplay) {
    import('/src/entry-display.ts')
  } else {
    import('/src/entry-editor.ts')
  }
</script>
</body>
</html>
